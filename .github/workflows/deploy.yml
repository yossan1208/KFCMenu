name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test KfcMenu.slnx
      - run: dotnet publish KfcMenu.Web/KfcMenu.Web.csproj -c Release -o publish
      - name: Set base href to the repository subpath
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html
      # app.css は名前が変わらず10分キャッシュされるので、新しい画面が古いCSSと組み合わさることがある。
      # 中身から作った印を付けて、版が変わったら必ず新しいCSSを読み込ませる
      - name: Add a content hash to the app.css link
        run: |
          hash=$(sha256sum publish/wwwroot/css/app.css | cut -c1-12)
          perl -pi -e "s|href=\"css/app.css\"|href=\"css/app.css?v=$hash\"|" publish/wwwroot/index.html
          grep -q "css/app.css?v=$hash" publish/wwwroot/index.html
      - run: cp publish/wwwroot/index.html publish/wwwroot/404.html
      - run: touch publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot
          # v4 以降は . で始まるファイルを含めないので、.nojekyll を含めるよう指定する
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
